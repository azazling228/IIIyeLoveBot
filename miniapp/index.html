<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#fff8f5">
    <title>Сердце — знакомства</title>
    <link rel="stylesheet" href="/style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script defer src="/app.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="ШУЕ">
          <span class="brand-mark">♡</span>
          <span>ШУЕ</span>
        </a>
        <button id="header-action" class="icon-button" aria-label="Обновить">↻</button>
      </header>

      <main id="main" class="main-content">
        <section class="loading-state">
          <div class="loader"></div>
          <p>Ищем твою половинку…</p>
        </section>
      </main>

      <nav class="bottom-nav" aria-label="Навигация">
        <button data-tab="discover" class="nav-item active">
          <span class="nav-icon">⌕</span><span>Искать</span>
        </button>
        <button data-tab="likes" class="nav-item">
          <span class="nav-icon">♡</span><span>Лайки</span>
          <span id="likes-badge" class="nav-badge hidden"></span>
        </button>
        <button data-tab="matches" class="nav-item">
          <span class="nav-icon">💘</span><span>Мэтчи</span>
        </button>
        <button data-tab="chats" class="nav-item">
          <span class="nav-icon">☏</span><span>Чаты</span>
          <span id="chats-badge" class="nav-badge hidden"></span>
        </button>
        <button data-tab="profile" class="nav-item">
          <span class="nav-icon">◉</span><span>Профиль</span>
        </button>
      </nav>
      <div id="toast" class="toast" role="status"></div>
    </div>
  </body>
</html>
