<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#fff8f5">
    <title>Сердце — знакомства</title>
    <link rel="stylesheet" href="/style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script defer src="/app.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="ШУЕ">
          <span class="brand-mark">♡</span>
          <span>ШУЕ</span>
        </a>
        <button id="header-action" class="icon-button" aria-label="Обновить">↻</button>
      </header>

      <main id="main" class="main-content">
        <section class="loading-state">
          <div class="loader"></div>
          <p>Ищем твою половинку…</p>
        </section>
      </main>

      <nav class="bottom-nav" aria-label="Навигация">
        <button data-tab="discover" class="nav-item active">
          <svg class="nav-icon-svg" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="10.8" cy="10.8" r="6.8"></circle>
            <path d="m16 16 4.5 4.5"></path>
          </svg><span>Искать</span>
        </button>
        <button data-tab="likes" class="nav-item">
          <span class="nav-icon">♡</span><span>Лайки</span>
          <span id="likes-badge" class="nav-badge hidden"></span>
        </button>
        <button data-tab="matches" class="nav-item">
          <svg class="nav-icon-svg matches-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M10.4 19.2 4.1 13a4.2 4.2 0 0 1 5.9-6l2 2 2-2a4.2 4.2 0 0 1 5.9 6l-1.6 1.6"></path>
            <path d="m14.1 12.8 1.1-1.1a3.1 3.1 0 0 1 4.4 4.4l-4.8 4.7-3.1-3.1"></path>
          </svg><span>Мэтчи</span>
        </button>
        <button data-tab="chats" class="nav-item">
          <span class="nav-icon">☏</span><span>Чаты</span>
          <span id="chats-badge" class="nav-badge hidden"></span>
        </button>
        <button data-tab="quiz" class="nav-item">
          <span class="nav-icon">♛</span><span>Тест</span>
        </button>
        <button data-tab="profile" class="nav-item">
          <span class="nav-icon">◉</span><span>Профиль</span>
        </button>
      </nav>
      <div id="toast" class="toast" role="status"></div>
    </div>
  </body>
</html>
